# Hourly trigger for the abandoned-basket reminder sweep.
#
# Vercel's Hobby plan only fires cron once a day, which is enough to work but
# blunts the sequence: the first reminder arrives the following morning instead
# of an hour after the customer leaves. This runs the same endpoint hourly for
# free, and the endpoint is safe to call as often as you like — a reminder is
# claimed in the database before it is sent, so nothing is ever sent twice.
#
# To enable: add a repository secret named CRON_SECRET whose value matches the
# CRON_SECRET environment variable in Vercel, then push this file. Delete the
# file (or disable the workflow) if you move to a Vercel plan that schedules
# cron hourly by itself.
name: Abandoned basket reminders

on:
  schedule:
    # Every hour, on the hour (UTC).
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder sweep
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "CRON_SECRET is not set — add it in Settings → Secrets → Actions."
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.palatecateringisrael.com/api/cron/cart-reminders")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "$body"
          # A non-2xx means the sweep did not run; fail loudly rather than
          # letting reminders quietly stop for weeks.
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
